---
name: Build container image

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  pull_request:
  schedule:
    - cron: '05 10 * * 1' # weekly regression rebuild
  workflow_dispatch:
    inputs:
      base_tag:
        description: Aurora nvidia-open base tag
        required: false
        default: stable-44.20260922.1
        type: string
      akmods_tag:
        description: Matching akmods-nvidia-open tag (blank = derive from base)
        required: false
        default: ''
        type: string
      cmpunlocker_ref:
        description: cmpunlocker git ref (tag, branch or commit)
        required: false
        default: v0.5
        type: string
      nvidia_version:
        description: Expected NVIDIA driver version in the base (compatibility guard)
        required: false
        default: '615.71.09'
        type: string
      publish:
        description: Push and sign the built image
        required: false
        default: true
        type: boolean
      rechunk:
        description: Rechunk the image before pushing (smaller delta updates)
        required: false
        default: true
        type: boolean

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}" # do not edit
  IMAGE_NAME: ${{ github.event.repository.name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.base_tag }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04
    timeout-minutes: 180

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo jq

      - name: Resolve image and akmods tags
        id: resolve
        env:
          BASE_TAG_INPUT: ${{ github.event.inputs.base_tag }}
          AKMODS_TAG_INPUT: ${{ github.event.inputs.akmods_tag }}
          CMPUNLOCKER_REF_INPUT: ${{ github.event.inputs.cmpunlocker_ref }}
          NVIDIA_VERSION_INPUT: ${{ github.event.inputs.nvidia_version }}
        run: |
          set -euo pipefail

          base_tag="${BASE_TAG_INPUT:-stable-44.20260922.1}"
          cmp_ref="${CMPUNLOCKER_REF_INPUT:-v0.5}"
          nvidia_version="${NVIDIA_VERSION_INPUT:-615.71.09}"

          base_repo="ghcr.io/ublue-os/aurora-nvidia-open"
          akmods_repo="ghcr.io/ublue-os/akmods-nvidia-open"

          base_labels="$(skopeo inspect --no-tags "docker://${base_repo}:${base_tag}")"
          kernel="$(jq -r '.Labels["ostree.linux"] // empty' <<<"${base_labels}")"
          if [[ -z "${kernel}" ]]; then
            echo "::error::Could not read ostree.linux from ${base_repo}:${base_tag}"
            exit 1
          fi

          akmods_tag="${AKMODS_TAG_INPUT:-}"
          if [[ -z "${akmods_tag}" ]]; then
            fedora="$(sed -E 's/.*\.fc([0-9]+)\..*/\1/' <<<"${kernel}")"
            case "${base_tag}" in
              stable|stable-*) akmods_flavor="coreos-testing" ;;
              *)               akmods_flavor="main" ;;
            esac
            akmods_tag="${akmods_flavor}-${fedora}-${kernel}"
          fi

          if ! skopeo inspect --no-tags "docker://${akmods_repo}:${akmods_tag}" >/dev/null 2>&1; then
            echo "::error::Missing matching akmods image ${akmods_repo}:${akmods_tag}"
            echo "Set the akmods_tag workflow input explicitly."
            exit 1
          fi

          case "${base_tag}" in
            stable*)  stream_tag="stable" ;;
            testing*) stream_tag="testing" ;;
            latest*)  stream_tag="latest" ;;
            *)        stream_tag="${base_tag}" ;;
          esac

          # `just` reads these from the environment; they override the values in
          # image-template.env for this run.
          {
            echo "BASE_TAG=${base_tag}"
            echo "AKMODS_TAG=${akmods_tag}"
            echo "CMPUNLOCKER_REF=${cmp_ref}"
            echo "EXPECTED_NVIDIA_VERSION=${nvidia_version}"
            echo "DEFAULT_TAG=${stream_tag}"
            echo "REPO_ORGANIZATION=${GITHUB_REPOSITORY_OWNER}"
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "IMAGE_NAME=${IMAGE_NAME,,}"
          } >> "${GITHUB_ENV}"

          {
            echo "base_tag=${base_tag}"
            echo "akmods_tag=${akmods_tag}"
            echo "cmpunlocker_ref=${cmp_ref}"
            echo "nvidia_version=${nvidia_version}"
            echo "kernel=${kernel}"
            echo "default_tag=${stream_tag}"
          } >> "${GITHUB_OUTPUT}"

          echo "Base:     ${base_repo}:${base_tag}"
          echo "Kernel:   ${kernel}"
          echo "Akmods:   ${akmods_repo}:${akmods_tag}"
          echo "cmp ref:  ${cmp_ref}"
          echo "NVIDIA:   ${nvidia_version} (expected)"

      - name: Check Just syntax
        run: just check

      - name: Decode MOK signing secrets
        id: mok
        env:
          MOK_KEY_B64: ${{ secrets.MOK_KEY }}
          MOK_CERT_B64: ${{ secrets.MOK_CERT }}
        run: |
          set -euo pipefail
          install -d -m 0700 "${RUNNER_TEMP}/mok"
          if [[ -n "${MOK_KEY_B64}" && -n "${MOK_CERT_B64}" ]]; then
            printf '%s' "${MOK_KEY_B64}" | base64 -d > "${RUNNER_TEMP}/mok/mok.key"
            printf '%s' "${MOK_CERT_B64}" | base64 -d > "${RUNNER_TEMP}/mok/mok.crt"
            chmod 0600 "${RUNNER_TEMP}/mok/mok.key"
            {
              echo "MOK_KEY=${RUNNER_TEMP}/mok/mok.key"
              echo "MOK_CERT=${RUNNER_TEMP}/mok/mok.crt"
            } >> "${GITHUB_ENV}"
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::MOK_KEY/MOK_CERT are not set; modules will be unsigned. Disable Secure Boot or configure secrets."
          fi

      # This actually builds the container image.
      - name: Build Image
        id: build-image
        run: just build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Lint bootc image
        run: just lint-image "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # Smaller delta updates; can be disabled from workflow_dispatch.
      - name: Rechunk with rpm-ostree
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.rechunk) }}
        id: rechunk
        run: just ostree-rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")"
          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "$GITHUB_OUTPUT"

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # Pull requests and non-default branches must never publish packages.
      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

          digest=$(< /tmp/digestfile)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Sign container image
        id: sign-image
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail

          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # Use the old bundle format so cosign 3.x works with bootc.
          COSIGN_ARGS=(-y --new-bundle-format=false --use-signing-config=false)
          if [[ -n "${COSIGN_PRIVATE_KEY}" ]]; then
            cosign sign "${COSIGN_ARGS[@]}" --key env://COSIGN_PRIVATE_KEY \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          else
            cosign sign "${COSIGN_ARGS[@]}" \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          fi

      - name: Summary
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            for tag in ${ALIAS_TAGS}; do
              echo "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            done
            echo "${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ steps.push-image.outputs.digest }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
